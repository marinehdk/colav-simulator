<!-- AIS sleeping target symbol (P3-S4, spec #90).
     IMO SN.1/Circ.243/Rev.1 Annex 1 §3.1: a sleeping AIS target is an acute
     isosceles triangle, oriented by heading (COG when heading absent), with
     the reported position at the centre/median of the triangle; the sleeping
     symbol is smaller than the activated one and carries no vector.
     Pointing "up" in this asset = north at rotation 0; callers rotate by
     heading. Cyan/teal per the repo OpenBridge night-chart palette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <g stroke-linejoin="round">
    <path d="M12 6 L18.2 18.4 L12 15.4 L5.8 18.4 Z" fill="rgba(24,32,38,0.85)"
      stroke="#2FBFA8" stroke-width="2"/>
    <circle cx="12" cy="13.4" r="1.15" fill="#2FBFA8"/>
  </g>
</svg>
