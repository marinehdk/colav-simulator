<!-- AIS dangerous target symbol (P3-S4, spec #90).
     IMO SN.1/Circ.243/Rev.1 Annex 1 §3.3: a dangerous target is shown as a
     bold red filled triangle with its speed vector, flashing until
     acknowledged. The repo renders the flash by alpha modulation; this asset
     is the bold-red frame. Selected targets add a four-corner bracket
     (renderer-side, mirroring target-position-marker.svg).
     Pointing "up" = north at rotation 0. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M18 21 L18 31" stroke="#FF4D5A" stroke-width="2"/>
    <path d="M18 5 L27 23 L18 18.8 L9 23 Z" fill="rgba(64,8,12,0.92)"
      stroke="#FF4D5A" stroke-width="3.2"/>
    <circle cx="18" cy="16.6" r="1.7" fill="#FF4D5A"/>
    <path d="M18 1.4 L18 5" stroke="#FF4D5A" stroke-width="2" stroke-dasharray="0.2 2.8"/>
  </g>
</svg>
