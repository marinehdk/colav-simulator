<!-- AIS lost target symbol (P3-S4, spec #90).
     IMO SN.1/Circ.243/Rev.1 Annex 1 §3.4: a lost AIS target keeps the target
     triangle at the last known position/orientation with a thick line drawn
     through it, flashing until acknowledged; the lost symbol carries no
     vector, heading line or ROT indication. Grey = signal lost.
     Pointing "up" = north at rotation 0. -->
<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 5.5 L20.4 18.2 L14 15.2 L7.6 18.2 Z" fill="rgba(24,32,38,0.6)"
      stroke="#8C979D" stroke-width="1.8"/>
    <path d="M5.4 6.2 L22.6 21.4 M22.6 6.2 L5.4 21.4" stroke="#8C979D" stroke-width="3"/>
  </g>
</svg>
