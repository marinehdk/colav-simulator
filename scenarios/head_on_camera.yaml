name: "head_on_camera1"
save_scenario: False
t_start: 0.0
t_end: 1200.0
dt_sim: 0.5
utm_zone: 33
map_size: [7000.0, 7000.0]
map_origin_enu: [37000.0, 6955000.0]
map_data_files: ["More_og_Romsdal_utm33.gdb"]
new_load_of_map_data: True
n_episodes: 1
type: HO
n_random_ships: 1
ship_list:
  # P1-1a review fix E2E (spec #90): camera-only KF ownship — the ONLY sensor is
  # the explicitly assembled external camera (external_cameras: scene key,
  # radar_x precedent). With this key absent no camera sensor is assembled and
  # the default tracker behaviour is untouched (default-off discipline, pinned
  # by tests/test_camera_association.py). The kf tracker (scenario_default)
  # builds from this config and iterates self.sensors — the assembled camera is
  # the ownship's only measurement source, which is what makes the YOLO-feed
  # on/off causal probe decisive.
  #
  # Geometry is a purpose-built STATION-KEEPING diagnostic pair (not a traffic
  # scenario): both ships run 1 m/s along 45 deg with a constant 60 m
  # separation, so the target sits dead-ahead in the mast_ptz_eo frame for the
  # whole session — the real YOLO feed gets a minutes-long detectable window
  # instead of the seconds-level one a passing approach leaves (the S2 obs run
  # managed exactly ONE detection frame in 2140 at conf 0.25). association_gate_m
  # is explicitly widened from the 50 m default: the georef box-height ranging
  # carries a render-vs-prior systematic (2.5 m boat prior against the rendered
  # fleet's visible height compresses georef range), so the causal window needs
  # headroom — the parameterization is the sanctioned tuning surface, the 50 m
  # default stays frozen in ExternalCameraParams.
  - csog_state: [6957500.0, 39500.0, 1.0, 45.0]
    waypoints: [[6957500.0, 6960900.0], [39500.0, 42900.0]]
    speed_plan: [1.0, 1.0]
    id: 0
    mmsi: 100
    guidance:
      los:
        pass_angle_threshold: 80.0
        R_a: 15.0
        K_p: 0.024
        K_i: 0.0
        max_cross_track_error_int: 101.0
        cross_track_error_int_threshold: 30.0
    tracker:
      kf:
        P_0: [49.1, 49.1, 0.11, 0.11]
        q: 0.1
    sensors:
      - external_cameras:
          sensor_id: 2          # camera_eo (mast_ptz_eo feed, contract §2)
          association_gate_m: 150.0
    controller:
      flsc:
        K_p_u: 3.0
        K_i_u: 0.3
        K_p_chi: 2.5
        K_d_chi: 3.0
        K_i_chi: 0.1
        max_speed_error_int: 4.0
        speed_error_int_threshold: 0.5
        max_chi_error_int: 90.0
        chi_error_int_threshold: 20.0
    model:
      viknes: ''
  - csog_state: [6957542.4, 39542.4, 1.0, 45.0]
    waypoints: [[6957542.4, 6958542.4], [39542.4, 40542.4]]
    speed_plan: [1.0, 1.0]
    id: 1
    mmsi: 101
    tracker:
      kf:
        P_0: [49.1, 49.1, 0.11, 0.11]
        q: 0.15
    sensors:
      - radar:
          max_range: 1000.0
          measurement_rate: 1.0
          R_ne: [25.0, 25.0]
          R_ne_true: [25.0, 25.0]
          R_polar_true: [64.0, 0.0003]
          generate_clutter: True
          clutter_cardinality_expectation: 5
          detection_probability: 0.95
          include_polar_meas_noise: False
      - ais:
          max_range: 5000.0
          ais_class: A
          R: [26.3, 26.3, 0.1, 0.1]
          R_true: [26.3, 26.3, 0.1, 0.1]
    guidance:
      los:
        pass_angle_threshold: 80.0
        R_a: 15.0
        K_p: 0.024
        K_i: 0.0
        max_cross_track_error_int: 101.0
        cross_track_error_int_threshold: 30.0
    controller:
      flsc:
        K_p_u: 3.0
        K_i_u: 0.3
        K_p_chi: 2.5
        K_d_chi: 3.0
        K_i_chi: 0.1
        max_speed_error_int: 4.0
        speed_error_int_threshold: 0.5
        max_chi_error_int: 90.0
        chi_error_int_threshold: 20.0
    model:
      viknes: ''
