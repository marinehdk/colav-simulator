factory: colav_simulator.integrations.potocnik_mpc:create
dependency_lock: ../uv.lock
kwargs:
  prediction_steps: 20
  candidate_count: 45
  horizon_dt_s: 5.0
  solve_period_s: 5.0
  deadline_s: 0.1
  max_heading_increment_deg: 10.0
  heading_increment_decay: 0.95
  # The paper default is 926 m. The standard OT scenes start inside that
  # zone, so the 100 s functional profile uses a documented 150 m buffer.
  collision_distance_m: 150.0
  # Paper COLREG application zone. Used as declared planning/visual range;
  # this functional port does not implement the paper's route/MPC mode switch.
  colreg_zone_distance_m: 5556.0
  continuity_weight: 4.0
  clearance_weight: 2.0
  reversal_weight: 2.0
  max_command_change_deg: 5.0
