factory: colav_simulator.integrations.potocnik_mpc:create
dependency_lock: ../uv.lock
kwargs:
  prediction_steps: 16
  candidate_count: 45
  horizon_dt_s: 50.0
  solve_period_s: 0.5
  deadline_s: 0.1
  max_heading_increment_deg: 20.0
  heading_increment_decay: 0.95
  # The paper default is 926 m. The standard OT scenes start inside that
  # zone, so the Phase 2 functional profile uses a documented 300 m buffer.
  collision_distance_m: 300.0
