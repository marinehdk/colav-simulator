# Issue #67 acceptance-only Mid-MPC spacing profile (stack B).
#
# NOT a shipped default: config/mid_mpc_ipopt.yaml keeps the published
# cpa_safe_m = 150.0; this copy raises the CPA safety distance to 190.0 m so
# the nominal centre distance clears the acceptance gate (>= 180 m centre
# distance, 4 x 44.1 m Lpp, with 10 m margin). cpa_hard_m stays at the
# published 50.0 m physical floor. Every other kwarg is byte-identical to the
# shipped profile (pinned by tests/test_acceptance_spacing_profiles.py).
factory: colav_simulator.integrations.mid_mpc_ipopt:create
dependency_lock: ../uv.lock
kwargs:
  horizon_steps: 80
  horizon_dt_s: 5.0
  solve_period_s: 10.0
  deadline_s: 20.0
  heading_window_deg: 45.0
  speed_min_mps: 0.0
  speed_max_mps: 8.0
  cpa_safe_m: 190.0
  cpa_hard_m: 50.0
  rot_max_deg_s: 3.0
  decel_max_mps2: 0.3
  route_lateral_scale_m: 1000.0
  route_weight: 1.0
